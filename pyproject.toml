[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dbf2sql"
version = "0.1.0"
description = "Migrate Visual FoxPro / dBase tables (.dbf) to SQL databases, with an Excel report of the result."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jesús Aquino" }]
requires-python = ">=3.9"
dependencies = [
    "dbfread>=2.0.7",
    "SQLAlchemy>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7"]

[project.scripts]
dbf2sql = "dbf2sql.cli:main"

[tool.setuptools]
packages = ["dbf2sql"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
